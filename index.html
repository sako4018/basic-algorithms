<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Алгоритми стъпка по стъпка</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applies a saved light theme before the first paint, so it doesn't
    // flash black first. main.js handles the theme button.
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (error) {
      // Storage can be blocked (private mode); then the page stays black.
    }
  </script>
</head>
<body>
  <header class="top-bar">
    <span class="logo">Алгоритми <span class="logo-accent">стъпка по стъпка</span></span>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Смени темата">◐</button>
  </header>

  <main>
    <!-- Home screen: main.js fills #levels with level sections and lesson cards -->
    <section id="home-screen">
      <div class="hero">
        <h1>Виж как мислят алгоритмите</h1>
        <p>Избери урок. Ще видиш всяка стъпка: какво се сравнява, кой ред от кода се изпълнява и как се променят променливите.</p>
      </div>
      <div id="levels"></div>
    </section>

    <!-- Lesson screen: player.js fills everything inside it -->
    <section id="lesson-screen" hidden>
      <button id="back-button" class="link-button" type="button">← Към уроците</button>
      <h1 id="lesson-title"></h1>

      <div class="lesson-layout">
        <div class="lesson-main">
          <div id="bars"></div>
          <div id="extra-view" hidden></div>
          <p id="step-text" class="step-text" aria-live="polite"></p>

          <div class="controls">
            <button id="prev-button" class="button secondary" type="button">← Назад</button>
            <span id="step-counter" class="step-counter"></span>
            <button id="next-button" class="button" type="button">Напред →</button>
          </div>

          <div class="controls-extra">
            <button id="play-button" class="text-button" type="button">▶ Пусни</button>
            <button id="random-button" class="text-button" type="button">Нов масив</button>
            <label class="speed-label" for="speed">Скорост на размяната
              <!-- Right = faster. Swap takes min + max - value ms, so 2000 = 0.8 s. -->
              <input id="speed" type="range" min="300" max="2500" step="100" value="2000">
            </label>
          </div>
          <p class="hint">Space или → напред, ← назад</p>
        </div>

        <aside class="lesson-side">
          <div class="code-panel">
            <div id="code-tabs" class="code-tabs"></div>
            <div id="code"></div>
          </div>
          <div id="vars"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/lessons/loop-trace.js"></script>
  <script src="js/lessons/min-max.js"></script>
  <script src="js/lessons/sum-count.js"></script>
  <script src="js/lessons/linear-search.js"></script>
  <script src="js/lessons/binary-search.js"></script>
  <script src="js/lessons/bubble-sort.js"></script>
  <script src="js/lessons/selection-sort.js"></script>
  <script src="js/lessons/insertion-sort.js"></script>
  <script src="js/lessons/merge-sort.js"></script>
  <script src="js/lessons/quick-sort.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
