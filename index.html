<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Алгоритми стъпка по стъпка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-bar">
    <span class="logo">Алгоритми <span class="logo-accent">стъпка по стъпка</span></span>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Смени темата">◐</button>
  </header>

  <main>
    <!-- Home screen: main.js fills #levels with level sections and lesson cards -->
    <section id="home-screen">
      <div class="hero">
        <h1>Виж как мислят алгоритмите</h1>
        <p>Избери урок. Ще видиш всяка стъпка: какво се сравнява, кой ред от кода се изпълнява и как се променят променливите.</p>
      </div>
      <div id="levels"></div>
    </section>

    <!-- Lesson screen: player.js fills everything inside it -->
    <section id="lesson-screen" hidden>
      <button id="back-button" class="link-button" type="button">← Към уроците</button>
      <h1 id="lesson-title"></h1>
      <p id="lesson-intro" class="intro"></p>

      <div class="lesson-layout">
        <div class="lesson-main">
          <div class="panel input-panel">
            <label for="array-input">Твоят масив (числа, разделени със запетая)</label>
            <div class="input-row">
              <input id="array-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
              <button id="apply-button" class="button" type="button">Приложи</button>
              <button id="random-button" class="button secondary" type="button">Случаен</button>
            </div>
            <p id="input-error" class="error"></p>
          </div>

          <div class="panel">
            <div id="bars"></div>
            <p id="step-text" class="step-text"></p>
          </div>

          <div class="panel controls">
            <div class="control-buttons">
              <button id="prev-button" class="button secondary" type="button">⏮ Назад</button>
              <button id="play-button" class="button" type="button">▶ Пусни</button>
              <button id="next-button" class="button secondary" type="button">Напред ⏭</button>
            </div>
            <div class="control-extra">
              <label class="speed-label" for="speed">Скорост
                <input id="speed" type="range" min="1" max="10" value="5">
              </label>
              <span id="step-counter" class="step-counter"></span>
            </div>
          </div>
        </div>

        <aside class="lesson-side">
          <div class="panel">
            <h2>Код</h2>
            <div id="code"></div>
          </div>

          <div class="panel">
            <h2>Променливи</h2>
            <div id="vars"></div>
          </div>

          <div class="panel counters">
            <div class="counter">
              <span class="counter-label">Сравнения</span>
              <span id="compare-count" class="counter-value">0</span>
            </div>
            <div class="counter">
              <span class="counter-label">Размени</span>
              <span id="swap-count" class="counter-value">0</span>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/lessons/bubble-sort.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
